<!doctype html>
<!-- GENERATED FILE — do not edit. Source of truth: content/articles/*.md -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191b" />
    <meta name="description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:site_name" content="Semantique" />
    <link rel="stylesheet" href="/articles/article.css" />
    <title>{{title}} — Semantique</title>
  </head>
  <body>
    <header class="article-header">
      <a class="brand" href="/" aria-label="Semantique home">
        <img src="/logo.svg" alt="Semantique" />
      </a>
      <a href="/articles/">← All articles</a>
    </header>

    <main class="shell article">
      <p class="eyebrow"><span class="slash">//</span> {{eyebrow}}</p>

      <h1>{{heading}}</h1>

      <p class="article-meta">
        <span>Semantique</span>
        <span class="dot">·</span>
        <span>{{date}}</span>
        <span class="dot">·</span>
        <span>{{readingMinutes}} min read</span>
      </p>

      <div class="article-body">
{{content}}
      </div>
    </main>

    <footer class="shell article-footer">
      <a class="footer-brand" href="/">semantique.</a>
      <span>AI engineering lab</span>
      <a href="/articles/">← Back to all articles</a>
    </footer>
  </body>
</html>
