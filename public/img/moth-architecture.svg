<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img"
     aria-labelledby="moth-architecture-title moth-architecture-desc">
  <title id="moth-architecture-title">Moth speech-to-text architecture</title>
  <desc id="moth-architecture-desc">Moth turns 16 kHz mono audio into an 80-bin log-mel, runs it through a Whisper-tiny encoder with two extra transformer blocks, projects every frame to 1,025 CTC tokens with a linear head, and decodes lowercase text with prefix beam search and a trigram language model. A Silero VAD gates silence and steady noise before the encoder.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#525b6a"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b9299"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#f7f7f5"/>

  <text x="32" y="40" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        letter-spacing="0.14em">MOTH ARCHITECTURE</text>
  <text x="32" y="76" fill="#22262e" font-size="28"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">From audio to lowercase text</text>
  <line x1="32" y1="96" x2="968" y2="96" stroke="#d5d8dd" stroke-width="0.8"/>

  <!-- pipeline -->
  <rect x="32" y="150" width="184" height="100" rx="6" fill="#e9ecf0" stroke="#525b6a" stroke-width="1"/>
  <rect x="40" y="158" width="24" height="12" rx="2" fill="none" stroke="#525b6a" stroke-width="0.8"/>
  <text x="52" y="167" fill="#525b6a" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle" letter-spacing="0.08em">IN</text>
  <text x="124" y="192" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">16 kHz mono</text>
  <text x="124" y="214" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">one clip · ≤ 30 s</text>
  <text x="124" y="230" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">record-then-transcribe</text>

  <rect x="248" y="150" width="196" height="100" rx="6" fill="#e9ecf0" stroke="#525b6a" stroke-width="1"/>
  <rect x="256" y="158" width="52" height="12" rx="2" fill="none" stroke="#525b6a" stroke-width="0.8"/>
  <text x="282" y="167" fill="#525b6a" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle" letter-spacing="0.08em">FRONT-END</text>
  <text x="346" y="192" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">80-bin log-mel</text>
  <text x="346" y="214" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">100 Hz · n_fft 400</text>
  <text x="346" y="230" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">Whisper filterbank</text>

  <rect x="476" y="150" width="216" height="100" rx="6" fill="#e9ecf0" stroke="#525b6a" stroke-width="1"/>
  <rect x="484" y="158" width="82" height="12" rx="2" fill="none" stroke="#525b6a" stroke-width="0.8"/>
  <text x="525" y="167" fill="#525b6a" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle" letter-spacing="0.08em">ACOUSTIC MODEL</text>
  <text x="584" y="192" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">Whisper-tiny + 2</text>
  <text x="584" y="214" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">6 blocks · width 384</text>
  <text x="584" y="230" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">11.6 M parameters</text>

  <rect x="724" y="150" width="244" height="100" rx="6" fill="#f3e3d8" stroke="#c07a54" stroke-width="1.2"/>
  <rect x="732" y="158" width="34" height="12" rx="2" fill="none" stroke="#c07a54" stroke-width="0.8"/>
  <text x="749" y="167" fill="#a65c38" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle" letter-spacing="0.08em">HEAD</text>
  <text x="846" y="192" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">Linear CTC</text>
  <text x="846" y="214" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">384 → 1,025 tokens</text>
  <text x="846" y="230" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">blank + IT+EN BPE</text>

  <line x1="216" y1="200" x2="240" y2="200" stroke="#525b6a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="444" y1="200" x2="468" y2="200" stroke="#525b6a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="692" y1="200" x2="716" y2="200" stroke="#525b6a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- VAD guard -->
  <rect x="32" y="330" width="412" height="112" rx="8" fill="#fbfbfa" stroke="#d5d8dd"
        stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="48" y="354" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        letter-spacing="0.14em">NO-SPEECH GUARD</text>
  <text x="48" y="382" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Silero VAD v5</text>
  <text x="48" y="404" fill="#6b7482" font-size="11"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">silence and steady noise produce no words</text>
  <text x="48" y="424" fill="#6b7482" font-size="11"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">music can still produce words</text>

  <line x1="124" y1="250" x2="124" y2="322" stroke="#8b9299" stroke-width="1"
        stroke-dasharray="3,3" marker-end="url(#arrow-dashed)"/>
  <text x="136" y="290" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">runs first</text>

  <!-- decode -->
  <line x1="846" y1="250" x2="846" y2="322" stroke="#525b6a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="858" y="290" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">log-probs</text>

  <rect x="724" y="330" width="244" height="100" rx="6" fill="#e9ecf0" stroke="#525b6a" stroke-width="1"/>
  <rect x="732" y="338" width="54" height="12" rx="2" fill="none" stroke="#525b6a" stroke-width="0.8"/>
  <text x="759" y="347" fill="#525b6a" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle" letter-spacing="0.08em">DECODE</text>
  <text x="846" y="372" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">Beam + trigram LM</text>
  <text x="846" y="394" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">beam 12 · top-k 10</text>
  <text x="846" y="410" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">LM 0.55 · token bonus 2.7</text>

  <line x1="846" y1="430" x2="846" y2="462" stroke="#525b6a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="724" y="470" width="244" height="96" rx="6" fill="#e9ecf0" stroke="#525b6a" stroke-width="1"/>
  <rect x="732" y="478" width="34" height="12" rx="2" fill="none" stroke="#525b6a" stroke-width="0.8"/>
  <text x="749" y="487" fill="#525b6a" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <text x="846" y="512" fill="#22262e" font-size="16" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">lowercase text</text>
  <text x="846" y="534" fill="#6b7482" font-size="11"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        text-anchor="middle">la sprint review è venerdì</text>
  <text x="846" y="552" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="middle">no punctuation · numbers spelled out</text>

  <!-- left column notes -->
  <text x="32" y="492" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        letter-spacing="0.14em">THE PACKAGE</text>

  <text x="32" y="532" fill="#22262e" font-size="22" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">19.7 MB</text>
  <text x="32" y="552" fill="#6b7482" font-size="9"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">model package</text>

  <text x="182" y="532" fill="#22262e" font-size="22" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">11.9 MB</text>
  <text x="182" y="552" fill="#6b7482" font-size="9"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">int8 ONNX graph</text>

  <text x="332" y="532" fill="#22262e" font-size="22" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">47×</text>
  <text x="332" y="552" fill="#6b7482" font-size="9"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">real time, 4 threads</text>

  <line x1="32" y1="592" x2="968" y2="592" stroke="#d5d8dd" stroke-width="0.8"/>

  <text x="32" y="620" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">No neural decoder · no language token · one shared IT+EN BPE</text>
  <text x="32" y="640" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">Encoder from openai/whisper-tiny (MIT) · Silero VAD v5 (MIT)</text>
  <text x="968" y="620" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="end">Apache-2.0 · 0.8.1</text>
  <text x="968" y="640" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        text-anchor="end">19,706,289 bytes</text>
</svg>
